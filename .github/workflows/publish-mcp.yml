name: Publish to MCP Registry

# Remote server: nothing to build/package. On a version tag (or manual run),
# authenticate to the official MCP Registry and publish server.json. The server is
# com.vulntel/mcp: DNS auth proves the vulntel.com namespace (TXT "v=MCPv1; k=ed25519; p=..."
# on vulntel.com; the private half is the MCP_REGISTRY_DNS_KEY repo secret).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate (DNS, vulntel.com)
        run: ./mcp-publisher login dns --domain vulntel.com --private-key "${{ secrets.MCP_REGISTRY_DNS_KEY }}"

      - name: Publish server.json
        run: ./mcp-publisher publish
