name: Deprecate io.github.rozetyp/vuln-intel (one-off)

on:
  workflow_dispatch:

jobs:
  deprecate:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC proves the io.github.rozetyp/* namespace
      contents: read
    steps:
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Deprecate all versions
        run: |
          ./mcp-publisher status --status deprecated --all-versions --message "Renamed: use com.vulntel/mcp (https://mcp.vulntel.com/mcp). The old endpoint keeps working." io.github.rozetyp/vuln-intel
